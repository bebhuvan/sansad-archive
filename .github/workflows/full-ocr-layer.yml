name: Full LiteParse OCR layer

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      house:
        type: string
        required: true
      parliament:
        type: string
        required: true
      session:
        type: string
        required: true
      max_pages:
        type: string
        default: "500"
    secrets:
      HF_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source:
        description: Source checkpoint family
        type: choice
        options: [elibrary, current]
        required: true
      house:
        description: House for a stable, extracted scope
        type: choice
        options: [lok_sabha, rajya_sabha]
        required: true
      parliament:
        description: Parliament label exactly as stored in the checkpoint
        type: string
        required: true
      session:
        description: Session label exactly as stored in the checkpoint
        type: string
        required: true
      max_pages:
        description: OCR pages per run, in complete 100-page shards
        type: string
        default: "500"

concurrency:
  group: full-ocr-${{ inputs.house }}-p${{ inputs.parliament }}-s${{ inputs.session }}
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOURCE: ${{ inputs.source }}
      HOUSE: ${{ inputs.house }}
      PARLIAMENT: ${{ inputs.parliament }}
      SESSION: ${{ inputs.session }}
      MAX_PAGES: ${{ inputs.max_pages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h .
      - name: Install OCR dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Validate cloud credentials
        run: |
          test -n "$HF_REPO"
          test -n "$HF_TOKEN"
      - name: Restore immutable originals and page inventory
        run: |
          case "$SOURCE" in elibrary|current) ;; *) exit 2 ;; esac
          PREFIX=""
          if [ "$SOURCE" = "elibrary" ]; then PREFIX="elibrary-"; fi
          python scripts/cloud_state.py restore --repo "$HF_REPO" \
            --path-in-repo "state/checkpoints/$PREFIX$HOUSE-p$PARLIAMENT-s$SESSION"
      - name: OCR all pages in bounded, durable shards
        run: |
          python scripts/full_ocr_layer.py --repo "$HF_REPO" \
            --source "$SOURCE" --house "$HOUSE" \
            --parliament "$PARLIAMENT" --session "$SESSION" \
            --max-pages "$MAX_PAGES"
      - name: Audit published local and Space Bunny layers against OCR visual evidence
        run: |
          python scripts/audit_published_ocr.py --repo "$HF_REPO" \
            --source "$SOURCE" --house "$HOUSE" \
            --parliament "$PARLIAMENT" --session "$SESSION" --publish
